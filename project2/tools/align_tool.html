<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rock / Djokovic alignment tool</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; margin: 16px; background: #f4f5f6; color: #1d2630; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; }
  canvas { background: #222; border: 1px solid #999; cursor: crosshair; width: min(800px, calc(100vw - 400px), calc(100vh - 40px)); min-width: 360px; }
  .panel { width: 320px; background: #fff; border: 1px solid #ccd; border-radius: 6px; padding: 14px; }
  .panel h2 { font-size: 15px; margin: 14px 0 6px; }
  .panel h2:first-child { margin-top: 0; }
  label { display: block; font-size: 13px; margin: 8px 0 2px; }
  input[type=range] { width: 100%; }
  button { margin: 4px 4px 0 0; padding: 5px 10px; font-size: 13px; }
  .modes label { display: inline-block; margin-right: 12px; font-size: 14px; }
  textarea { width: 100%; height: 150px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .hint { font-size: 12px; color: #5a6672; line-height: 1.45; }
  .val { float: right; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="800" height="800"></canvas>
  <div class="panel">
    <h2>1. Mode</h2>
    <div class="modes">
      <label><input type="radio" name="mode" value="move" checked> Move Rock</label>
      <label><input type="radio" name="mode" value="mask"> Draw mask</label>
    </div>
    <p class="hint">Move Rock: drag to move him. Draw mask: click to add points around the face, drag a point to adjust it.</p>

    <h2>2. Rock placement</h2>
    <label>Rotation <span class="val" id="angleV"></span></label>
    <input id="angle" type="range" min="-60" max="60" step="0.5">
    <label>Scale <span class="val" id="scaleV"></span></label>
    <input id="scale" type="range" min="0.3" max="1.5" step="0.005">
    <label>Rock opacity <span class="val" id="opV"></span></label>
    <input id="op" type="range" min="0" max="1" step="0.05" value="0.4">

    <h2>3. View</h2>
    <button id="zoomFace">Zoom to face</button><button id="zoomFit">Whole photo</button>
    <label><input type="checkbox" id="preview"> Preview hard cut (Rock only inside mask)</label>

    <h2>4. Mask</h2>
    <button id="undo">Undo point</button><button id="clear">Clear mask</button>
    <p class="hint" id="count"></p>

    <h2>5. Export</h2>
    <button id="export">Update JSON</button><button id="download">Download JSON</button><button id="copy">Copy</button>
    <textarea id="out" spellcheck="false"></textarea>
    <p class="hint">Save it as <code>project2/data/rock_djokovic.json</code> (or just send it to me), then run <code>main.py</code>.</p>
  </div>
</div>
<script>
// All coordinates are in the 1000 x 1000 Djokovic crop (pixels 500..1500 of the original photo).
const CROP = 1000;
const state = { cx: 446.4, cy: 318.5, angle: -5.32, scale: 0.7444, poly: [] };
const view = { x0: 0, y0: 0, w: CROP };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dj = new Image(); dj.src = 'djokovic_crop.jpg';
const rock = new Image(); rock.src = 'rock.jpg';
let loaded = 0; [dj, rock].forEach(im => im.onload = () => { if (++loaded === 2) draw(); });

const $ = id => document.getElementById(id);
const angle = $('angle'), scale = $('scale'), op = $('op');
angle.value = state.angle; scale.value = state.scale;

function toCrop(e) {
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left) * canvas.width / r.width;
  const py = (e.clientY - r.top) * canvas.height / r.height;
  return [view.x0 + px * view.w / canvas.width, view.y0 + py * view.w / canvas.height];
}
function toScreen(x, y) {
  return [(x - view.x0) * canvas.width / view.w, (y - view.y0) * canvas.height / view.w];
}

function drawRock(alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(state.cx, state.cy);
  ctx.rotate(state.angle * Math.PI / 180);
  ctx.scale(state.scale, state.scale);
  ctx.drawImage(rock, -rock.width / 2, -rock.height / 2);
  ctx.restore();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const k = canvas.width / view.w;
  ctx.setTransform(k, 0, 0, k, -view.x0 * k, -view.y0 * k);
  ctx.drawImage(dj, 0, 0);
  if ($('preview').checked && state.poly.length > 2) {
    ctx.save();
    ctx.beginPath();
    state.poly.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath(); ctx.clip();
    drawRock(1);
    ctx.restore();
  } else {
    drawRock(parseFloat(op.value));
  }
  // mask outline
  if (state.poly.length) {
    ctx.lineWidth = 2 / k; ctx.strokeStyle = '#00e5ff'; ctx.fillStyle = 'rgba(0,229,255,0.12)';
    ctx.beginPath();
    state.poly.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    if (state.poly.length > 2) { ctx.closePath(); if (!$('preview').checked) ctx.fill(); }
    ctx.stroke();
    ctx.fillStyle = '#ffeb3b';
    state.poly.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 4 / k, 0, 7); ctx.fill(); });
  }
  $('angleV').textContent = state.angle.toFixed(1) + '°';
  $('scaleV').textContent = state.scale.toFixed(3);
  $('opV').textContent = parseFloat(op.value).toFixed(2);
  $('count').textContent = state.poly.length + ' mask points' + (state.poly.length < 3 ? ' (need at least 3)' : '');
  updateJSON();
}

function mode() { return document.querySelector('input[name=mode]:checked').value; }
let drag = null;
canvas.addEventListener('mousedown', e => {
  const [x, y] = toCrop(e);
  if (mode() === 'move') { drag = { type: 'rock', dx: x - state.cx, dy: y - state.cy }; return; }
  const tol = 10 * view.w / canvas.width;
  const i = state.poly.findIndex(([px, py]) => Math.hypot(px - x, py - y) < tol);
  if (i >= 0) drag = { type: 'pt', i };
  else { state.poly.push([x, y]); draw(); }
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const [x, y] = toCrop(e);
  if (drag.type === 'rock') { state.cx = x - drag.dx; state.cy = y - drag.dy; }
  else state.poly[drag.i] = [x, y];
  draw();
});
window.addEventListener('mouseup', () => drag = null);

angle.oninput = () => { state.angle = parseFloat(angle.value); draw(); };
scale.oninput = () => { state.scale = parseFloat(scale.value); draw(); };
op.oninput = draw; $('preview').onchange = draw;
$('undo').onclick = () => { state.poly.pop(); draw(); };
$('clear').onclick = () => { state.poly = []; draw(); };
$('zoomFace').onclick = () => { view.x0 = 250; view.y0 = 50; view.w = 450; draw(); };
$('zoomFit').onclick = () => { view.x0 = 0; view.y0 = 0; view.w = CROP; draw(); };

function payload() {
  return {
    note: 'Coordinates are in the 1000x1000 crop starting at (500, 500) of djokovic_racket.jpg',
    crop_origin: [500, 500],
    rock_center: [+state.cx.toFixed(2), +state.cy.toFixed(2)],
    angle_degrees: +state.angle.toFixed(2),
    scale: +state.scale.toFixed(4),
    mask_polygon: state.poly.map(([x, y]) => [+x.toFixed(1), +y.toFixed(1)])
  };
}
function updateJSON() { $('out').value = JSON.stringify(payload(), null, 1); }
$('export').onclick = updateJSON;
$('copy').onclick = () => { $('out').select(); document.execCommand('copy'); };
$('download').onclick = () => {
  const blob = new Blob([JSON.stringify(payload(), null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'rock_djokovic.json'; a.click();
};
$('zoomFace').click();
</script>
</body>
</html>
